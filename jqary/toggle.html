<h1>toggle()</h1>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<button id="toggle">Przelacz akapit</button>
<p id="akapit1">Pierwszy akapit</p>


<script>
    $( function(){
        $("#toggle").click( function(){
            $("#akapit1").toggle();
        } );
    } );
</script>
