<h1>Hover() - mouseenter oraz mouseover</h1>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<p id="akapit1">Najedz aby wyswietlic komunikat</p>
<p>Drugi akapit</p>


<script>
    $( function(){
        $("#akapit1").hover( function(){
            alert("Witaj na mojej stronie");
        }, function(){
            alert("Do zobaczenia");
        } );
    } );
</script>
